services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ALLOWED_TELEGRAM_ID: ${ALLOWED_TELEGRAM_ID}
      VAULT_PATH: /vault
      AGY_BIN: agy
      AGY_TIMEOUT: 2m
      LLM_BACKEND: ${LLM_BACKEND:-agy}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_MODEL: ${GEMINI_API_MODEL:-gemini-2.5-flash-lite}
      GEMINI_API_TIMEOUT: ${GEMINI_API_TIMEOUT:-2m}
    volumes:
      - /mnt/memory-vault:/vault
      # Mount the WHOLE ~/.gemini directory (not just antigravity-cli/): where
      # `agy auth login` persists its OAuth token is not verified — its
      # predecessor gemini-cli wrote ~/.gemini/oauth_creds.json directly under
      # ~/.gemini. Mounting the parent guarantees the token survives container
      # recreation wherever it lands. On first attach, Docker seeds this empty
      # named volume from the image's /root/.gemini (which contains the baked-in
      # antigravity-cli/mcp_config.json).
      - agy-auth:/root/.gemini

volumes:
  agy-auth:
